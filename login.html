<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandado Express | Acceso Oficial</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-yellow: #FFC107;
            --brand-yellow-bright: #FFD700;
            --brand-yellow-glow: rgba(255, 215, 0, 0.35);
            --bg-black: #050608;
            --card-dark: #0D0F16;
            --input-dark: #12151F;
            --border-dark: rgba(255, 215, 0, 0.25);
            --border-active: rgba(255, 215, 0, 0.7);
            --text-main: #FFFFFF;
            --text-sub: #A0A5B5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-black);
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
            position: relative;
        }

        /* Luces Neón de Fondo (Glow Orbs) */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        .glow-orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
            top: -50px;
            left: -50px;
        }
        .glow-orb-2 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.1) 0%, transparent 70%);
            bottom: -50px;
            right: -50px;
        }

        /* Tarjeta Contenedora Principal 3D */
        .login-card {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(20, 23, 33, 0.95) 0%, rgba(13, 15, 22, 0.98) 100%);
            width: 100%;
            max-width: 450px;
            margin: auto;
            padding: 40px 28px;
            border-radius: 30px;
            border: 1px solid var(--border-dark);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 30px rgba(255, 215, 0, 0.08);
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Encabezado */
        .brand-header {
            text-align: center;
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Badge 3D del Logo de Inicio */
        .logo-badge-3d {
            width: 92px;
            height: 92px;
            background: linear-gradient(135deg, rgba(255, 224, 51, 0.18) 0%, rgba(255, 193, 7, 0.04) 100%);
            border: 1.5px solid var(--border-active);
            border-radius: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px var(--brand-yellow-glow), inset 0 2px 5px rgba(255, 255, 255, 0.3);
            animation: floatIcon 3s ease-in-out infinite alternate;
        }

        @keyframes floatIcon {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(-1deg); }
        }

        .logo-badge-3d svg {
            width: 60px;
            height: 60px;
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .brand-title span {
            background: linear-gradient(180deg, #FFF066 0%, #FFC107 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(255, 193, 7, 0.4));
        }

        /* TICKER / MARQUEE DE PALABRAS DINÁMICAS */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background: rgba(255, 215, 0, 0.08);
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            padding: 7px 0;
            margin-top: 10px;
            border-radius: 8px;
            position: relative;
        }

        .ticker-move {
            display: flex;
            width: max-content;
            animation: tickerScroll 12s linear infinite;
        }

        @keyframes tickerScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .ticker-item {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--brand-yellow-bright);
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 0 15px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ticker-dot {
            width: 5px;
            height: 5px;
            background-color: var(--brand-yellow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--brand-yellow);
        }

        /* Selector de Rol Profesional 3D */
        .role-section-label {
            font-size: 0.73rem;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            margin-bottom: 12px;
            display: block;
        }

        .role-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--input-dark);
            padding: 6px;
            border-radius: 22px;
            border: 1px solid var(--border-dark);
            margin-bottom: 26px;
            gap: 6px;
        }

        .role-tab {
            padding: 12px 4px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.78rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .role-icon-box-3d {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .role-icon-box-3d svg {
            width: 26px;
            height: 26px;
        }

        .role-tab:hover .role-icon-box-3d {
            background: rgba(255, 215, 0, 0.12);
            border-color: rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }

        .role-tab.active {
            color: #000000;
            background: linear-gradient(135deg, var(--brand-yellow-bright) 0%, var(--brand-yellow) 100%);
            box-shadow: 0 8px 20px var(--brand-yellow-glow);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .role-tab.active .role-icon-box-3d {
            background: rgba(0, 0, 0, 0.18);
            border-color: rgba(0, 0, 0, 0.1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Formulario */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field svg.icon-left {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            fill: var(--text-sub);
            transition: fill 0.3s ease;
        }

        .input-field input {
            width: 100%;
            padding: 16px 44px 16px 48px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            border-color: var(--brand-yellow-bright);
            box-shadow: 0 0 18px var(--brand-yellow-glow);
            background-color: #161A26;
        }

        .input-field input:focus ~ svg.icon-left {
            fill: var(--brand-yellow-bright);
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-sub);
            transition: fill 0.3s ease;
        }

        .toggle-btn:hover svg {
            fill: var(--text-main);
        }

        /* Opciones */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.82rem;
        }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            cursor: pointer;
            user-select: none;
        }

        .remember-check input[type="checkbox"] {
            accent-color: var(--brand-yellow);
            width: 17px;
            height: 17px;
            border-radius: 4px;
        }

        .forgot-link {
            color: var(--brand-yellow-bright);
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.2s ease;
        }

        .forgot-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Botón de Enviar con Shimmer */
        .btn-primary {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, var(--brand-yellow-bright) 0%, var(--brand-yellow) 100%);
            color: #000000;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px var(--brand-yellow-glow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: rotate(30deg);
            transition: transform 0.6s ease;
            opacity: 0;
        }

        .btn-primary:hover::after {
            opacity: 1;
            transform: rotate(30deg) translate(100%, 0);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 215, 0, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary svg {
            width: 20px;
            height: 20px;
            fill: #000000;
            transition: transform 0.3s ease;
        }

        .btn-primary:hover svg {
            transform: translateX(4px);
        }

        /* Divisor */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-sub);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-dark);
        }

        .divider span {
            padding: 0 12px;
        }

        /* Redes Sociales */
        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 13px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: var(--brand-yellow-bright);
            background-color: #1A1E29;
            transform: translateY(-2px);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-main);
        }

        /* Footer */
        .signup-prompt {
            text-align: center;
            margin-top: 26px;
            font-size: 0.88rem;
            color: var(--text-sub);
        }

        .signup-prompt a {
            color: var(--brand-yellow-bright);
            text-decoration: none;
            font-weight: 800;
            margin-left: 4px;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }

        @media (max-width: 380px) {
            .login-card {
                padding: 30px 20px;
            }
            .role-tab {
                font-size: 0.7rem;
                padding: 10px 2px;
            }
            .brand-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- Luces Neón de Fondo -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="login-card">
        
        <!-- ENCABEZADO CON LOGO DE INICIO OFICIAL EN SVG 3D -->
        <div class="brand-header">
            <div class="logo-badge-3d">
                <!-- ISOTIPO VECTORIAL 3D: CAJA DE ENVIOS CON RAYO EXPRESS -->
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="yellow3D" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFF066" />
                            <stop offset="60%" stop-color="#FFD700" />
                            <stop offset="100%" stop-color="#FF9900" />
                        </linearGradient>
                        <linearGradient id="dark3D" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2A2F3D" />
                            <stop offset="100%" stop-color="#10121A" />
                        </linearGradient>
                    </defs>
                    <!-- Sombra Base -->
                    <ellipse cx="50" cy="86" rx="32" ry="5" fill="#000000" opacity="0.6" />
                    <!-- Caja Cubo 3D -->
                    <path d="M50 16 L84 32 L50 48 L16 32 Z" fill="url(#yellow3D)" stroke="#FFFFFF" stroke-width="1.2"/>
                    <path d="M16 32 L50 48 V82 L16 66 Z" fill="url(#dark3D)" stroke="url(#yellow3D)" stroke-width="1.8"/>
                    <path d="M50 48 L84 32 V66 L50 82 Z" fill="#181B26" stroke="url(#yellow3D)" stroke-width="1.8"/>
                    <!-- Rayo Express Frontal Neón -->
                    <path d="M52 28 L36 52 H50 L46 72 L66 46 H52 L56 28 Z" fill="url(#yellow3D)" filter="drop-shadow(0 2px 6px rgba(255,215,0,0.6))"/>
                    <!-- Líneas de Velocidad Traseras -->
                    <path d="M8 26 H22 M4 40 H16 M10 54 H20" stroke="url(#yellow3D)" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="brand-title">Mandado <span>Express</span></h1>

            <!-- TICKER DE PALABRAS DINÁMICAS EN MOVIMIENTO -->
            <div class="ticker-wrap">
                <div class="ticker-move">
                    <div class="ticker-item">COMIDA <span class="ticker-dot"></span></div>
                    <div class="ticker-item">BEBIDAS <span class="ticker-dot"></span></div>
                    <div class="ticker-item">MERCADERÍA <span class="ticker-dot"></span></div>
                    <div class="ticker-item">CIGARRILLOS <span class="ticker-dot"></span></div>
                    <div class="ticker-item">FARMACIA <span class="ticker-dot"></span></div>
                    <div class="ticker-item">LO QUE QUIERAS <span class="ticker-dot"></span></div>
                    <!-- Duplicado para loop infinito sin saltos -->
                    <div class="ticker-item">COMIDA <span class="ticker-dot"></span></div>
                    <div class="ticker-item">BEBIDAS <span class="ticker-dot"></span></div>
                    <div class="ticker-item">MERCADERÍA <span class="ticker-dot"></span></div>
                    <div class="ticker-item">CIGARRILLOS <span class="ticker-dot"></span></div>
                    <div class="ticker-item">FARMACIA <span class="ticker-dot"></span></div>
                    <div class="ticker-item">LO QUE QUIERAS <span class="ticker-dot"></span></div>
                </div>
            </div>
        </div>

        <!-- SELECCIÓN DE PERFIL DE ACCESO 3D -->
        <span class="role-section-label">Selecciona tu perfil de acceso:</span>
        <div class="role-tabs">
            
            <!-- CLIENTE -->
            <button type="button" class="role-tab active" onclick="setRole('cliente')">
                <div class="role-icon-box-3d">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M24 10H21C21 7.24 18.76 5 16 5C13.24 5 11 7.24 11 10H8C6.9 10 6 10.9 6 12V25C6 26.1 6.9 27 8 27H24C25.1 27 26 26.1 26 25V12C26 10.9 25.1 10 24 10ZM16 7C17.66 7 19 8.34 19 10H13C13 8.34 14.34 7 16 7ZM24 25H8V12H24V25Z" fill="currentColor"/>
                        <circle cx="12" cy="16" r="1.5" fill="currentColor"/>
                        <circle cx="20" cy="16" r="1.5" fill="currentColor"/>
                    </svg>
                </div>
                Cliente
            </button>

            <!-- REPARTIDOR (BICICLETA CON MOCHILA) -->
            <button type="button" class="role-tab" onclick="setRole('repartidor')">
                <div class="role-icon-box-3d">
                    <svg viewBox="0 0 32 32" fill="none">
                        <!-- Ciclista / Repartidor -->
                        <circle cx="21" cy="7" r="2.5" fill="currentColor"/>
                        <path d="M13 14L17 10L20 13H24V15H21.5L19.5 13.5L17.5 16.5L19.5 21H17L15.5 17.5L13.5 19.5V23H11.5V18L14.5 15L13.5 13.5C12.5 14.5 11.5 15 10 15V13C11.2 13 12.2 12.5 13 11.5L15 9.5C15.4 9.1 16 8.9 16.5 9C17.1 9.1 17.6 9.4 18 10L19.5 12H23V10H18.5L16.5 7.5C15.8 6.6 14.7 6 13.5 6C12.5 6 11.5 6.4 10.8 7.1L8 10V15H10V11.2L13 14Z" fill="currentColor"/>
                        <!-- Rueda Trasera Bicicleta -->
                        <circle cx="8" cy="24" r="4.5" stroke="currentColor" stroke-width="2"/>
                        <!-- Rueda Delantera Bicicleta -->
                        <circle cx="24" cy="24" r="4.5" stroke="currentColor" stroke-width="2"/>
                        <!-- Mochila Express en Espalda -->
                        <rect x="7" y="11" width="4.5" height="6.5" rx="1.2" fill="currentColor"/>
                    </svg>
                </div>
                Repartidor
            </button>

            <!-- COMERCIO -->
            <button type="button" class="role-tab" onclick="setRole('comercio')">
                <div class="role-icon-box-3d">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M27 7H5V10H27V7Z" fill="currentColor"/>
                        <path d="M28 12L26.5 7.5H5.5L4 12V15H5V25H19V15H23V25H27V15H28V12ZM17 23H7V15H17V23ZM25 23H21V15H25V23Z" fill="currentColor"/>
                    </svg>
                </div>
                Comercio
            </button>
        </div>

        <!-- Formulario -->
        <form id="loginForm" onsubmit="submitLogin(event)">
            <input type="hidden" id="selectedRole" value="cliente">

            <div class="input-group">
                <label for="email">Correo Electrónico o Teléfono</label>
                <div class="input-field">
                    <svg class="icon-left" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <input type="text" id="email" placeholder="tu@correo.com o celular" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-field">
                    <svg class="icon-left" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-btn" onclick="togglePasswordVisibility()">
                        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-check">
                    <input type="checkbox" id="remember">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste clave?</a>
            </div>

            <button type="submit" class="btn-primary" id="btnSubmit">
                <span id="btnText">Ingresar como Cliente</span>
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
        </form>

        <div class="divider">
            <span>O accede con</span>
        </div>

        <div class="social-login">

    <script>
        function setRole(role) {
            const tabs = document.querySelectorAll('.role-tab');
            tabs.forEach(tab => tab.classList.remove('active'));

            const roleInput = document.getElementById('selectedRole');
            const btnText = document.getElementById('btnText');

            roleInput.value = role;

            if (role === 'cliente') {
                tabs[0].classList.add('active');
                btnText.textContent = 'Ingresar como Cliente';
            } else if (role === 'repartidor') {
                tabs[1].classList.add('active');
                btnText.textContent = 'Ingresar como Repartidor';
            } else if (role === 'comercio') {
                tabs[2].classList.add('active');
                btnText.textContent = 'Ingresar como Comercio';
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            pwdInput.type = (pwdInput.type === 'password') ? 'text' : 'password';
        }

        function submitLogin(e) {
            e.preventDefault();
            const role = document.getElementById('selectedRole').value;
            const email = document.getElementById('email').value;
            alert(`Iniciando sesión en Mandado Express [${role.toUpperCase()}]: ${email}`);
        }
    </script>

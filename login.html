<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandado Express | Iniciar Sesión</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-yellow: #FFC107;
            --brand-yellow-bright: #FFD700;
            --yellow-glow: rgba(255, 215, 0, 0.35);
            --bg-black: #050608;
            --card-dark: rgba(14, 16, 22, 0.92);
            --input-dark: #12151C;
            --border-dark: rgba(255, 215, 0, 0.2);
            --text-main: #FFFFFF;
            --text-sub: #9EA3B2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de Partículas en Movimiento */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Resplandores Neón de Fondo */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            pointer-events: none;
        }
        .glow-orb-1 {
            width: 380px;
            height: 380px;
            background: var(--yellow-glow);
            top: -60px;
            left: -60px;
        }
        .glow-orb-2 {
            width: 320px;
            height: 320px;
            background: rgba(255, 193, 7, 0.15);
            bottom: -60px;
            right: -60px;
        }

        /* Tarjeta Contenedora Principal */
        .login-card {
            position: relative;
            z-index: 10;
            background: var(--card-dark);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 480px;
            padding: 42px 36px;
            border-radius: 28px;
            border: 1px solid var(--border-dark);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 0 35px rgba(255, 215, 0, 0.12);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .login-card:hover {
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                0 0 45px rgba(255, 215, 0, 0.2);
        }

        /* Header del Logo Real */
        .logo-header {
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
        }

        /* Selector de Rol Dinámico */
        .role-tabs {
            display: flex;
            background: var(--input-dark);
            padding: 5px;
            border-radius: 16px;
            border: 1px solid var(--border-dark);
            margin-bottom: 26px;
            gap: 4px;
        }

        .role-tab {
            flex: 1;
            padding: 11px 4px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .role-tab i {
            font-size: 1.15rem;
        }

        .role-tab:hover {
            color: var(--text-main);
        }

        .role-tab.active {
            background: linear-gradient(135deg, var(--brand-yellow-bright), var(--brand-yellow));
            color: #000000;
            box-shadow: 0 5px 18px var(--yellow-glow);
            transform: translateY(-1px);
        }

        /* Campos de Entrada */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field i.icon-left {
            position: absolute;
            left: 18px;
            color: var(--text-sub);
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }

        .input-field input {
            width: 100%;
            padding: 15px 48px 15px 52px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            border-color: var(--brand-yellow-bright);
            box-shadow: 0 0 20px var(--yellow-glow), inset 0 0 10px rgba(255, 215, 0, 0.1);
            background-color: #171B24;
        }

        .input-field input:focus ~ i.icon-left,
        .input-field input:focus ~ i.toggle-password {
            color: var(--brand-yellow-bright);
        }

        .toggle-password {
            position: absolute;
            right: 18px;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 1.05rem;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        /* Opciones de Login */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 26px;
            font-size: 0.85rem;
        }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            cursor: pointer;
            user-select: none;
        }

        .remember-check input[type="checkbox"] {
            accent-color: var(--brand-yellow);
            width: 17px;
            height: 17px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--brand-yellow-bright);
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.2s;
        }

        .forgot-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Botón de Envío Principal */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--brand-yellow-bright) 0%, var(--brand-yellow) 100%);
            color: #000000;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px var(--yellow-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 215, 0, 0.5);
            background: #FFE033;
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Divisor Social */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 26px 0;
            color: var(--text-sub);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-dark);
        }

        .divider span {
            padding: 0 12px;
        }

        /* Botones de Redes Sociales */
        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 11px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 1.15rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social-btn:hover {
            border-color: var(--brand-yellow-bright);
            background-color: #1A1E29;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        /* Footer de Registro */
        .signup-prompt {
            text-align: center;
            margin-top: 28px;
            font-size: 0.88rem;
            color: var(--text-sub);
        }

        .signup-prompt a {
            color: var(--brand-yellow-bright);
            text-decoration: none;
            font-weight: 800;
            margin-left: 5px;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 34px 22px;
                border-radius: 22px;
            }
            .role-tab {
                font-size: 0.72rem;
                padding: 9px 2px;
            }
        }
    </style>
</head>
<body>

    <!-- Partículas Dinámicas en Movimiento -->
    <canvas id="bgCanvas"></canvas>

    <!-- Luces de Fondo Neón -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <!-- Tarjeta Principal -->
    <div class="login-card">
        
        <!-- HEADER CON LA IMAGEN DE TU LOGO OFICIAL -->
        <div class="logo-header">
            <!-- Guarda la imagen de tu logo en la misma carpeta con el nombre "logo.png" -->
            <img src="logo.png" alt="Mandado Express Logo" class="logo-img">
        </div>

        <!-- Selector de Rol (Cliente, Repartidor, Comercio) -->
        <div class="role-tabs">
            <button type="button" class="role-tab active" onclick="setRole('cliente')">
                <i class="fa-solid fa-bag-shopping"></i>
                Cliente
            </button>
            <button type="button" class="role-tab" onclick="setRole('repartidor')">
                <i class="fa-solid fa-motorcycle"></i>
                Repartidor
            </button>
            <button type="button" class="role-tab" onclick="setRole('comercio')">
                <i class="fa-solid fa-store"></i>
                Comercio
            </button>
        </div>

        <!-- Formulario de Acceso -->
        <form id="loginForm" onsubmit="submitLogin(event)">
            <input type="hidden" id="selectedRole" value="cliente">

            <div class="input-group">
                <label for="email">Correo o Teléfono</label>
                <div class="input-field">
                    <i class="fa-regular fa-envelope icon-left"></i>
                    <input type="text" id="email" placeholder="tu@correo.com o celular" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-check">
                    <input type="checkbox" id="remember">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-primary" id="btnSubmit">
                <span>Ingresar como Cliente</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Divisor Social -->
        <div class="divider">
            <span>O accede con</span>
        </div>

        <!-- Botones Redes Sociales -->
        <div class="social-login">
            <button class="social-btn" title="Google"><i class="fa-brands fa-google"></i></button>
            <button class="social-btn" title="Apple"><i class="fa-brands fa-apple"></i></button>
            <button class="social-btn" title="Facebook"><i class="fa-brands fa-facebook-f"></i></button>
        </div>

        <!-- Enlace de Registro -->
        <div class="signup-prompt">
            ¿Aún no formas parte? 
            <a href="#" id="signupLink">Crea tu cuenta</a>
        </div>

    </div>

    <!-- Script de Interactividad y Fondo Animado -->
    <script>
        function setRole(role) {
            const tabs = document.querySelectorAll('.role-tab');
            tabs.forEach(tab => tab.classList.remove('active'));

            const roleInput = document.getElementById('selectedRole');
            const submitBtn = document.getElementById('btnSubmit');

            roleInput.value = role;

            if (role === 'cliente') {
                tabs[0].classList.add('active');
                submitBtn.querySelector('span').textContent = 'Ingresar como Cliente';
            } else if (role === 'repartidor') {
                tabs[1].classList.add('active');
                submitBtn.querySelector('span').textContent = 'Ingresar como Repartidor';
            } else if (role === 'comercio') {
                tabs[2].classList.add('active');
                submitBtn.querySelector('span').textContent = 'Ingresar como Comercio';
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        function submitLogin(e) {
            e.preventDefault();
            const role = document.getElementById('selectedRole').value;
            const email = document.getElementById('email').value;

            alert(`Accediendo a Mandado Express como [${role.toUpperCase()}]: ${email}`);
        }

        // Fondo Dinámico con Partículas Neón
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#FFD700';
                ctx.fill();
            });

            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>

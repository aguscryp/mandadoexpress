<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mandado Express | Acceso Oficial</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-yellow: #FFC107;
            --brand-yellow-bright: #FFD700;
            --brand-yellow-glow: rgba(255, 215, 0, 0.25);
            --bg-black: #050608;
            --card-dark: #0D0F15;
            --input-dark: #13161F;
            --border-dark: rgba(255, 215, 0, 0.2);
            --border-active: rgba(255, 215, 0, 0.6);
            --text-main: #FFFFFF;
            --text-sub: #9EA3B2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Luces Neón de Ambiente */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        .glow-orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.12) 0%, transparent 70%);
            top: -20px;
            left: -20px;
        }
        .glow-orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.08) 0%, transparent 70%);
            bottom: -20px;
            right: -20px;
        }

        /* Tarjeta Principal */
        .login-card {
            position: relative;
            z-index: 10;
            background: var(--card-dark);
            width: 100%;
            max-width: 440px;
            padding: 40px 30px;
            border-radius: 28px;
            border: 1px solid var(--border-dark);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 215, 0, 0.05);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header e Icono de Repartidor en Moto */
        .brand-header {
            text-align: center;
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .moto-badge {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(255, 193, 7, 0.03));
            border: 1px solid var(--border-active);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 0 25px var(--brand-yellow-glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .moto-badge:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4);
        }

        .moto-badge svg {
            width: 54px;
            height: 54px;
            fill: var(--brand-yellow-bright);
            filter: drop-shadow(0 2px 10px rgba(255, 215, 0, 0.5));
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.9rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.5px;
            color: #FFFFFF;
            text-transform: uppercase;
        }

        .brand-title span {
            background: linear-gradient(180deg, #FFE033 0%, #FFC107 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Selector de Rol Profesional */
        .role-section-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: block;
        }

        .role-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--input-dark);
            padding: 6px;
            border-radius: 20px;
            border: 1px solid var(--border-dark);
            margin-bottom: 26px;
            gap: 6px;
        }

        .role-tab {
            padding: 12px 4px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .role-icon-box {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        .role-tab svg {
            width: 20px;
            height: 20px;
            fill: var(--text-sub);
            transition: fill 0.3s ease;
        }

        .role-tab:hover .role-icon-box {
            background: rgba(255, 215, 0, 0.1);
        }

        .role-tab:hover svg {
            fill: var(--brand-yellow-bright);
        }

        .role-tab.active {
            color: #000000;
            background: linear-gradient(135deg, var(--brand-yellow-bright), var(--brand-yellow));
            box-shadow: 0 6px 18px var(--brand-yellow-glow);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .role-tab.active .role-icon-box {
            background: rgba(0, 0, 0, 0.15);
        }

        .role-tab.active svg {
            fill: #000000;
        }

        /* Formulario */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field svg.icon-left {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            fill: var(--text-sub);
            transition: fill 0.3s ease;
        }

        .input-field input {
            width: 100%;
            padding: 15px 44px 15px 48px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            -webkit-appearance: none;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            border-color: var(--brand-yellow-bright);
            box-shadow: 0 0 15px var(--brand-yellow-glow);
            background-color: #171A24;
        }

        .input-field input:focus + .icon-left,
        .input-field input:focus ~ svg {
            fill: var(--brand-yellow-bright);
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-sub);
            transition: fill 0.3s ease;
        }

        .toggle-btn:hover svg {
            fill: var(--text-main);
        }

        /* Opciones */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.82rem;
        }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            cursor: pointer;
            user-select: none;
        }

        .remember-check input[type="checkbox"] {
            accent-color: var(--brand-yellow);
            width: 17px;
            height: 17px;
            border-radius: 4px;
        }

        .forgot-link {
            color: var(--brand-yellow-bright);
            text-decoration: none;
            font-weight: 700;
            transition: opacity 0.2s ease;
        }

        .forgot-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Botón de Enviar */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--brand-yellow-bright), var(--brand-yellow));
            color: #000000;
            border: none;
            border-radius: 14px;
            font-size: 0.98rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 22px var(--brand-yellow-glow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: rotate(30deg);
            transition: transform 0.6s ease;
            opacity: 0;
        }

        .btn-primary:hover::after {
            opacity: 1;
            transform: rotate(30deg) translate(100%, 0);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 215, 0, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
            fill: #000000;
            transition: transform 0.3s ease;
        }

        .btn-primary:hover svg {
            transform: translateX(4px);
        }

        /* Divisor */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-sub);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-dark);
        }

        .divider span {
            padding: 0 12px;
        }

        /* Redes Sociales */
        .social-login {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: var(--brand-yellow-bright);
            background-color: #1A1E29;
            transform: translateY(-2px);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-main);
        }

        /* Footer */
        .signup-prompt {
            text-align: center;
            margin-top: 26px;
            font-size: 0.88rem;
            color: var(--text-sub);
        }

        .signup-prompt a {
            color: var(--brand-yellow-bright);
            text-decoration: none;
            font-weight: 800;
            margin-left: 4px;
            transition: text-decoration 0.2s ease;
        }

        .signup-prompt a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Luces de Fondo -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="login-card">
        
        <!-- ENCABEZADO CON REPARTIDOR EN MOTO CON CASCO -->
        <div class="brand-header">
            <div class="moto-badge">
                <!-- SVG Vectorial: Repartidor en Scooter con Casco y Mochila/Caja Express -->
                <svg viewBox="0 0 24 24">
                    <!-- Casco / Cabeza -->
                    <circle cx="15" cy="5" r="2.2"/>
                    <!-- Cuerpo / Torso inclinándose -->
                    <path d="M12.5 8.5L9 11.5V15h2v-2.5l2.5-2 2.5 1.5V15h2v-3.5l-3.5-2.5-2-.5z"/>
                    <!-- Scooter y Ruedas -->
                    <path d="M19 16.5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                    <path d="M6 16.5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
                    <!-- Chasis y Manubrio del Scooter -->
                    <path d="M17.5 15.5l1.5-4h-2.5l-1 2.5H11l-3 2H5v1.5h12.5z"/>
                    <!-- Caja de Reparto Express Trasera -->
                    <rect x="3" y="9" width="4.5" height="5" rx="1" fill="currentColor"/>
                    <!-- Líneas de Velocidad -->
                    <path d="M1 8h2m-3 3h2.5M.5 14h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="brand-title">Mandado <span>Express</span></h1>
            <p class="brand-subtitle">LO QUE NECESITAS, DONDE ESTÉS</p>
        </div>

        <!-- SELECCIÓN DE PERFIL DE ACCESO -->
        <span class="role-section-label">Selecciona tu perfil de acceso:</span>
        <div class="role-tabs">
            <button type="button" class="role-tab active" onclick="setRole('cliente')">
                <div class="role-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12z"/></svg>
                </div>
                Cliente
            </button>
            <button type="button" class="role-tab" onclick="setRole('repartidor')">
                <div class="role-icon-box">
                    <!-- Icono Repartidor Moto -->
                    <svg viewBox="0 0 24 24">
                        <circle cx="15" cy="5" r="2"/>
                        <path d="M12.5 8.5L9 11.5V15h2v-2.5l2.5-2 2.5 1.5V15h2v-3.5l-3.5-2.5z"/>
                        <circle cx="19" cy="18.5" r="1.5"/>
                        <circle cx="6" cy="18.5" r="1.5"/>
                        <path d="M17.5 15.5l1.5-4h-2.5l-1 2.5H11l-3 2H5v1.5h12.5z"/>
                        <rect x="3" y="9" width="4" height="5" rx="0.8"/>
                    </svg>
                </div>
                Repartidor
            </button>
            <button type="button" class="role-tab" onclick="setRole('comercio')">
                <div class="role-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 6H6v-4h6v4z"/></svg>
                </div>
                Comercio
            </button>
        </div>

        <!-- Formulario -->
        <form id="loginForm" onsubmit="submitLogin(event)">
            <input type="hidden" id="selectedRole" value="cliente">

            <div class="input-group">
                <label for="email">Correo Electrónico o Teléfono</label>
                <div class="input-field">
                    <svg class="icon-left" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <input type="text" id="email" placeholder="tu@correo.com o celular" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-field">
                    <svg class="icon-left" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="toggle-btn" onclick="togglePasswordVisibility()">
                        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </button>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-check">
                    <input type="checkbox" id="remember">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste clave?</a>
            </div>

            <button type="submit" class="btn-primary" id="btnSubmit">
                <span id="btnText">Ingresar como Cliente</span>
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
        </form>

        <div class="divider">
            <span>O accede con</span>
        </div>

        <div class="social-login">
            <button type="button" class="social-btn" title="Google"><svg viewBox="0 0 24 24"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg></button>
            <button type="button" class="social-btn" title="Apple"><svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.66-.8 1.11-1.92.99-3.04-.96.04-2.12.64-2.8 1.44-.6.7-1.13 1.84-.99 2.94 1.07.08 2.15-.54 2.8-1.34"/></svg></button>
            <button type="button" class="social-btn" title="Facebook"><svg viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H7.5v-3H10V9.5C10 7.01 11.49 5.6 13.78 5.6c1.1 0 2.25.2 2.25.2v2.47h-1.27c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.45 3h-2.33v6.8c4.56-.93 8-4.96 8-9.8z"/></svg></button>
        </div>

        <div class="signup-prompt">
            ¿Aún no formas parte? 
            <a href="#">Crea tu cuenta</a>
        </div>

    </div>

    <script>
        function setRole(role) {
            const tabs = document.querySelectorAll('.role-tab');
            tabs.forEach(tab => tab.classList.remove('active'));

            const roleInput = document.getElementById('selectedRole');
            const btnText = document.getElementById('btnText');

            roleInput.value = role;

            if (role === 'cliente') {
                tabs[0].classList.add('active');
                btnText.textContent = 'Ingresar como Cliente';
            } else if (role === 'repartidor') {
                tabs[1].classList.add('active');
                btnText.textContent = 'Ingresar como Repartidor';
            } else if (role === 'comercio') {
                tabs[2].classList.add('active');
                btnText.textContent = 'Ingresar como Comercio';
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            pwdInput.type = (pwdInput.type === 'password') ? 'text' : 'password';
        }

        function submitLogin(e) {
            e.preventDefault();
            const role = document.getElementById('selectedRole').value;
            const email = document.getElementById('email').value;
            alert(`Iniciando sesión en Mandado Express [${role.toUpperCase()}]: ${email}`);
        }
    </script>
</body>
</html>

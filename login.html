<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandado Express | Iniciar Sesión</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-yellow: #FFC107;
            --brand-yellow-bright: #FFD700;
            --yellow-glow: rgba(255, 215, 0, 0.2);
            --bg-black: #050608;
            --card-dark: #0E1016;
            --input-dark: #12151C;
            --border-dark: rgba(255, 215, 0, 0.25);
            --text-main: #FFFFFF;
            --text-sub: #9EA3B2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Luces Neón Estáticas de Fondo (Sin animación pesada para no tildar el cel) */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            pointer-events: none;
        }
        .glow-orb-1 {
            width: 280px;
            height: 280px;
            background: var(--yellow-glow);
            top: -40px;
            left: -40px;
        }
        .glow-orb-2 {
            width: 240px;
            height: 240px;
            background: rgba(255, 193, 7, 0.1);
            bottom: -40px;
            right: -40px;
        }

        /* Tarjeta Principal Ligera */
        .login-card {
            position: relative;
            z-index: 10;
            background: var(--card-dark);
            width: 100%;
            max-width: 440px;
            padding: 35px 28px;
            border-radius: 24px;
            border: 1px solid var(--border-dark);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.08);
        }

        /* Header con Marco de Logo */
        .logo-header {
            text-align: center;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-frame {
            width: 140px;
            height: 140px;
            border-radius: 20px;
            padding: 3px;
            background: linear-gradient(135deg, var(--brand-yellow-bright), transparent, var(--brand-yellow));
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.25);
            margin-bottom: 8px;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 17px;
            display: block;
        }

        /* Selector de Rol */
        .role-tabs {
            display: flex;
            background: var(--input-dark);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--border-dark);
            margin-bottom: 24px;
            gap: 4px;
        }

        .role-tab {
            flex: 1;
            padding: 10px 2px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .role-tab i {
            font-size: 1.1rem;
        }

        .role-tab.active {
            background: linear-gradient(135deg, var(--brand-yellow-bright), var(--brand-yellow));
            color: #000000;
            box-shadow: 0 4px 12px var(--yellow-glow);
        }

        /* Campos de Formulario */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field i.icon-left {
            position: absolute;
            left: 16px;
            color: var(--text-sub);
            font-size: 1rem;
        }

        .input-field input {
            width: 100%;
            padding: 14px 44px 14px 48px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .input-field input:focus {
            border-color: var(--brand-yellow-bright);
            background-color: #171B24;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 1rem;
        }

        /* Opciones */
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 0.8rem;
        }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-sub);
            cursor: pointer;
        }

        .remember-check input[type="checkbox"] {
            accent-color: var(--brand-yellow);
            width: 16px;
            height: 16px;
        }

        .forgot-link {
            color: var(--brand-yellow-bright);
            text-decoration: none;
            font-weight: 700;
        }

        /* Botón de Ingreso */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--brand-yellow-bright) 0%, var(--brand-yellow) 100%);
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px var(--yellow-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Divisor */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 22px 0;
            color: var(--text-sub);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-dark);
        }

        .divider span {
            padding: 0 10px;
        }

        /* Redes Sociales */
        .social-login {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Footer */
        .signup-prompt {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .signup-prompt a {
            color: var(--brand-yellow-bright);
            text-decoration: none;
            font-weight: 800;
            margin-left: 4px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .login-card {
                padding: 28px 18px;
            }
            .logo-frame {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- Luces de Ambiente (Estáticas para máximo rendimiento) -->
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="login-card">
        
        <!-- LOGO OFICIAL -->
        <div class="logo-header">
            <div class="logo-frame">
                <img src="logo.png" alt="Mandado Express Logo" class="logo-img">
            </div>
        </div>

        <!-- Selector de Rol -->
        <div class="role-tabs">
            <button type="button" class="role-tab active" onclick="setRole('cliente')">
                <i class="fa-solid fa-bag-shopping"></i>
                Cliente
            </button>
            <button type="button" class="role-tab" onclick="setRole('repartidor')">
                <i class="fa-solid fa-motorcycle"></i>
                Repartidor
            </button>
            <button type="button" class="role-tab" onclick="setRole('comercio')">
                <i class="fa-solid fa-store"></i>
                Comercio
            </button>
        </div>

        <!-- Formulario -->
        <form id="loginForm" onsubmit="submitLogin(event)">
            <input type="hidden" id="selectedRole" value="cliente">

            <div class="input-group">
                <label for="email">Correo o Teléfono</label>
                <div class="input-field">
                    <i class="fa-regular fa-envelope icon-left"></i>
                    <input type="text" id="email" placeholder="tu@correo.com o celular" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-check">
                    <input type="checkbox" id="remember">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste la clave?</a>
            </div>

            <button type="submit" class="btn-primary" id="btnSubmit">
                <span>Ingresar como Cliente</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="divider">
            <span>O accede con</span>
        </div>

        <div class="social-login">
            <button type="button" class="social-btn"><i class="fa-brands fa-google"></i></button>
            <button type="button" class="social-btn"><i class="fa-brands fa-apple"></i></button>
            <button type="button" class="social-btn"><i class="fa-brands fa-facebook-f"></i></button>
        </div>

        <div class="signup-prompt">
            ¿Aún no formas parte? 
            <a href="#">Crea tu cuenta</a>
        </div>

    </div>

    <!-- Script súper liviano de funciones básicas -->
    <script>
        function setRole(role) {
            const tabs = document.querySelectorAll('.role-tab');
            tabs.forEach(tab => tab.classList.remove('active'));

            const roleInput = document.getElementById('selectedRole');
            const submitBtn = document.getElementById('btnSubmit');

            roleInput.value = role;

            if (role === 'cliente') {
                tabs[0].classList.add('active');
                submitBtn.querySelector('span').textContent = 'Ingresar como Cliente';
            } else if (role === 'repartidor') {
                tabs[1].classList.add('active');
                submitBtn.querySelector('span').textContent = 'Ingresar como Repartidor';
            } else if (role === 'comercio') {
                tabs[2].classList.add('active');
                submitBtn.querySelector('span').textContent = 'Ingresar como Comercio';
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        function submitLogin(e) {
            e.preventDefault();
            const role = document.getElementById('selectedRole').value;
            const email = document.getElementById('email').value;

            alert(`Ingresando a Mandado Express [${role.toUpperCase()}]: ${email}`);
        }
    </script>
</body>
</html>

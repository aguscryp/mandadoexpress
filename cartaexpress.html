<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandado Express | Inicio</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet.js CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --brand-yellow: #FFC107;
            --brand-yellow-bright: #FFD700;
            --brand-yellow-glow: rgba(255, 215, 0, 0.25);
            --bg-dark: #07080C;
            --card-dark: #0F121C;
            --card-inner: #161A26;
            --input-dark: #121622;
            --border-dark: rgba(255, 215, 0, 0.18);
            --border-active: #FFD700;
            --text-main: #FFFFFF;
            --text-sub: #9EA4B5;
            --green-open: #00E676;
            --red-closed: #FF5252;
            --orange-tag: #FF9100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 110px;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 20px;
            position: relative;
            z-index: 1;
        }

        /* --- HEADER PRINCIPAL SIN CONTORNOS --- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 18px;
        }

        .brand-logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon-box {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--brand-yellow-bright) 0%, var(--brand-yellow) 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--brand-yellow-glow);
        }

        .logo-icon-box svg {
            width: 26px;
            height: 26px;
            fill: #000;
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: #FFFFFF;
            letter-spacing: -0.3px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        /* Botón sin contorno (Flat Minimalista) */
        .icon-btn-clean {
            background: none;
            border: none;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--brand-yellow-bright);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease, opacity 0.2s ease;
            text-decoration: none;
        }

        .icon-btn-clean:active {
            transform: scale(0.92);
        }

        .icon-btn-clean svg {
            width: 26px;
            height: 26px;
            fill: var(--brand-yellow-bright);
        }

        .badge-notify {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--red-closed);
            color: #FFF;
            font-size: 0.65rem;
            font-weight: 900;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-dark);
        }

        /* --- CENTRO DE NOTIFICACIONES --- */
        .notifications-dropdown {
            position: absolute;
            top: 55px;
            right: 0;
            width: 320px;
            background: var(--card-dark);
            border: 1px solid var(--border-active);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px var(--brand-yellow-glow);
            z-index: 150;
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeInDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .notifications-dropdown.active {
            display: flex;
        }

        .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 8px;
        }

        .notif-header h4 {
            font-size: 0.95rem;
            font-weight: 800;
            color: #FFF;
        }

        .notif-clear {
            font-size: 0.75rem;
            color: var(--brand-yellow-bright);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
        }

        .notif-item {
            background: var(--card-inner);
            padding: 10px 12px;
            border-radius: 12px;
            border-left: 3px solid var(--brand-yellow-bright);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .notif-item.unread {
            border-left-color: var(--green-open);
        }

        .notif-title { font-size: 0.82rem; font-weight: 800; color: #FFF; }
        .notif-desc { font-size: 0.75rem; color: var(--text-sub); }
        .notif-time { font-size: 0.65rem; color: var(--brand-yellow-bright); align-self: flex-end; margin-top: 2px; }

        /* --- TOAST NOTIFICATIONS --- */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            width: calc(100% - 40px);
            max-width: 440px;
            pointer-events: none;
        }

        .toast-card {
            background: var(--card-dark);
            border: 1px solid var(--brand-yellow-bright);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px var(--brand-yellow-glow);
            pointer-events: auto;
            animation: slideInToast 0.35s cubic-bezier(0.16, 1, 0.3, 1), fadeOutToast 0.3s ease 3.7s forwards;
            margin-bottom: 10px;
        }

        .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .toast-icon svg { width: 20px; height: 20px; fill: var(--brand-yellow-bright); }
        .toast-title { font-size: 0.85rem; font-weight: 800; color: #FFF; }
        .toast-body { font-size: 0.78rem; color: var(--text-sub); }

        @keyframes slideInToast { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOutToast { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- TARJETA DE UBICACIÓN --- */
        .location-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        .location-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .location-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex: 1;
        }

        .location-pin-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .location-pin-icon svg { width: 20px; height: 20px; fill: var(--brand-yellow-bright); }
        .location-text-group { display: flex; flex-direction: column; gap: 2px; }
        .location-title { font-size: 1.05rem; font-weight: 800; color: #FFFFFF; }
        .location-address-text { font-size: 0.82rem; color: var(--text-sub); font-weight: 500; line-height: 1.3; }

        .btn-permission-gps {
            width: 100%;
            padding: 12px 14px;
            background: linear-gradient(135deg, var(--brand-yellow-bright) 0%, var(--brand-yellow) 100%);
            color: #000;
            border: none;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--brand-yellow-glow);
            transition: transform 0.2s ease;
        }

        .btn-permission-gps:active { transform: scale(0.98); }
        .btn-permission-gps svg { width: 18px; height: 18px; fill: #000; }

        /* --- BARRA BÚSQUEDA ANIMADA --- */
        .search-bar-wrapper {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin-bottom 0.3s ease;
            margin-bottom: 0;
        }

        .search-bar-wrapper.active {
            max-height: 70px;
            opacity: 1;
            margin-bottom: 20px;
        }

        .search-input-wrap { position: relative; }
        .search-input-wrap input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: var(--input-dark);
            border: 1px solid var(--border-dark);
            border-radius: 16px;
            color: #FFF;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-sub);
        }

        /* --- CATEGORÍAS CON LOGOS PREMIUM --- */
        .categories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .category-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 18px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-pill svg {
            width: 18px;
            height: 18px;
            fill: var(--brand-yellow-bright);
            transition: fill 0.2s ease;
        }

        .category-pill.active {
            background: linear-gradient(135deg, var(--brand-yellow-bright) 0%, var(--brand-yellow) 100%);
            color: #000;
            border-color: var(--brand-yellow-bright);
            box-shadow: 0 4px 12px var(--brand-yellow-glow);
        }

        .category-pill.active svg {
            fill: #000;
        }

        /* --- STORES GRID --- */
        .stores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .store-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: var(--text-main);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .store-card:hover {
            border-color: var(--brand-yellow-bright);
            transform: translateY(-2px);
        }

        .store-img-wrapper {
            width: 100%;
            height: 110px;
            border-radius: 18px;
            background: var(--card-inner);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .store-info { display: flex; flex-direction: column; gap: 6px; text-align: center; }
        .store-name { font-size: 1rem; font-weight: 800; color: #FFF; }
        .store-cat-tag { font-size: 0.72rem; color: var(--brand-yellow-bright); font-weight: 700; text-transform: uppercase; }

        .status-pill-btn {
            align-self: center;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
            border: none;
        }

        .status-pill-btn.open { background: var(--brand-yellow-bright); color: #000; }
        .status-pill-btn.closed { background: rgba(255, 82, 82, 0.15); color: var(--red-closed); border: 1px solid var(--red-closed); }

        .empty-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* --- MODAL MAPA --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .location-modal {
            background: var(--card-dark);
            border: 1px solid var(--border-active);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 480px;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .location-modal { transform: translateY(0); }

        #leafletMap {
            width: 100%;
            height: 220px;
            border-radius: 18px;
            border: 1px solid var(--border-active);
            margin: 12px 0;
        }

        /* --- MENÚ NAVEGACIÓN FLOTANTE --- */
        .bottom-nav-floating {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 440px;
            height: 66px;
            background: rgba(15, 18, 28, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-dark);
            border-radius: 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 20px var(--brand-yellow-glow);
            padding: 0 8px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            text-decoration: none;
            color: var(--text-sub);
            font-size: 0.7rem;
            font-weight: 700;
            background: none;
            border: none;
            cursor: pointer;
            flex: 1;
            height: 100%;
            position: relative;
            transition: all 0.2s ease;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: var(--text-sub);
            transition: transform 0.2s ease, fill 0.2s ease;
        }

        .nav-item.active { color: var(--brand-yellow-bright); }
        .nav-item.active svg { fill: var(--brand-yellow-bright); transform: translateY(-2px); }

        .badge-cart {
            position: absolute;
            top: 8px;
            right: 22%;
            background: var(--brand-yellow-bright);
            color: #000;
            font-size: 0.65rem;
            font-weight: 900;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- TOASTS CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <!-- HEADER LIMPIO SIN CONTORNOS EN NOTIFICACIONES/PERFIL -->
        <header class="app-header">
            <a href="cartaexpress.html" class="brand-logo-title">
                <div class="logo-icon-box">
                    <svg viewBox="0 0 24 24"><path d="M19 7c0-1.1-.9-2-2-2h-3v2h3v2.65L13.52 14H10V9H6c-2.21 0-4 1.79-4 4v3h2c0 1.66 1.34 3 3 3s3-1.34 3-3h4.48L19 10.35V7zM7 17c-.55 0-1-.45-1-1h2c0 .55-.45 1-1 1z"/></svg>
                </div>
                <h1 class="brand-name">Mandado Express</h1>
            </a>

            <div class="header-actions">
                <!-- Botón Campana Limpio -->
                <button class="icon-btn-clean" onclick="toggleNotificaciones()" aria-label="Notificaciones">
                    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                    <div class="badge-notify" id="notifyBadge">0</div>
                </button>

                <!-- Desplegable Notificaciones -->
                <div class="notifications-dropdown" id="notifDropdown">
                    <div class="notif-header">
                        <h4>Notificaciones</h4>
                        <button class="notif-clear" onclick="limpiarNotificaciones()">Borrar todas</button>
                    </div>
                    <div class="notif-list" id="notifList"></div>
                </div>

                <!-- Botón Perfil Limpio -->
                <a href="perfil.html" class="icon-btn-clean" aria-label="Perfil">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </a>
            </div>
        </header>

        <!-- TARJETA UBICACIÓN (SIN EL BOTÓN 'ABRIR EN MAPS' PARA CLIENTES) -->
        <section class="location-card">
            <div class="location-top-row" onclick="abrirModalUbicacion()">
                <div class="location-left">
                    <div class="location-pin-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    </div>
                    <div class="location-text-group">
                        <span class="location-title">Tu Dirección</span>
                        <span class="location-address-text" id="currentAddress">Presiona "Permitir ubicación" abajo</span>
                    </div>
                </div>
            </div>

            <button class="btn-permission-gps" onclick="solicitarPermisoUbicacion()">
                <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06z"/></svg>
                Permitir Ubicación
            </button>
        </section>

        <!-- BUSCADOR -->
        <div class="search-bar-wrapper" id="searchContainer">
            <div class="search-input-wrap">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Buscar locales o productos..." oninput="filtrarContenido()">
            </div>
        </div>

        <!-- CATEGORÍAS CON ICONOS VECTORIALES PREMIUM -->
        <div class="categories-scroll">
            <button onclick="filtrarPorCategoria('todas', this)" class="category-pill active">
                <svg viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm0-13v6h5V5h-5zm-6 6h5V5h-5v6z"/></svg>
                <span>Todas</span>
            </button>
            <button onclick="filtrarPorCategoria('almacen', this)" class="category-pill">
                <svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
                <span>Almacén</span>
            </button>
            <button onclick="filtrarPorCategoria('panchero', this)" class="category-pill">
                <svg viewBox="0 0 24 24"><path d="M18.06 22.99h1.66c.84 0 1.53-.64 1.63-1.48l.83-7.22c.13-1.15-.77-2.14-1.93-2.14H3.75c-1.16 0-2.06.99-1.93 2.14l.83 7.22c.1.84.79 1.48 1.63 1.48h1.66c.1.84.79 1.48 1.63 1.48h8.92c.84 0 1.53-.64 1.63-1.48zM12 2C6.48 2 2 6.48 2 12h20c0-5.52-4.48-10-10-10z"/></svg>
                <span>Panchero</span>
            </button>
            <button onclick="filtrarPorCategoria('heladeria', this)" class="category-pill">
                <svg viewBox="0 0 24 24"><path d="M12 2c-3.04 0-5.5 2.46-5.5 5.5 0 2.22 1.31 4.13 3.2 5.01L12 22l2.3-9.49c1.89-.88 3.2-2.79 3.2-5.01C17.5 4.46 15.04 2 12 2z"/></svg>
                <span>Heladería</span>
            </button>
            <button onclick="filtrarPorCategoria('bebidas', this)" class="category-pill">
                <svg viewBox="0 0 24 24"><path d="M20 3H4v2h16V3zm-1 5H5v11c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V8zm-3 8h-2v-2h2v2zm0-4h-2v-2h2v2z"/></svg>
                <span>Bebidas</span>
            </button>
        </div>

        <!-- STORES GRID -->
        <section>
            <div class="stores-grid" id="storesGrid"></div>
        </section>
    </div>

    <!-- MODAL MAPA INTERACTIVO -->
    <div class="modal-overlay" id="locationModal">
        <div class="location-modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Confirma tu Ubicación</h3>
                <button onclick="cerrarModalUbicacion()" style="background:none; border:none; color:#FFF; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div id="leafletMap"></div>
            <button class="btn-permission-gps" style="width:100%; margin-top:10px;" onclick="guardarUbicacionManual()">Guardar esta Ubicación</button>
        </div>
    </div>

    <!-- NAVEGACIÓN FLOTANTE -->
    <nav class="bottom-nav-floating">
        <a href="cartaexpress.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Inicio</span>
        </a>
        <button class="nav-item" onclick="toggleBuscador()">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>Buscar</span>
        </button>
        <a href="carrito.html" class="nav-item">
            <div class="badge-cart" id="cartBadge" style="display:none;">0</div>
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            <span>Carrito</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Perfil</span>
        </a>
    </nav>

    <!-- Leaflet.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let mapInstance = null;
        let markerInstance = null;
        let usuarioUbicacion = { lat: -31.5375, lng: -68.5364, direccion: '', departamento: 'Santa Lucía' };
        let categoriaSeleccionada = 'todas';

        let notificaciones = [
            { id: 1, titulo: "¡Bienvenido a Mandado Express!", desc: "Configura tu ubicación para comenzar a hacer tus pedidos.", hora: "Ahora", leida: false },
            { id: 2, titulo: "Promoción Activa 🛵", desc: "Envíos con 20% OFF en locales seleccionados.", hora: "Hace 10m", leida: false }
        ];

        const tiendasBD = [
            { id: '1', nombre: 'Almacén Don Pedro', categoria: 'almacen', emoji: '🏪', abierto: true },
            { id: '2', nombre: 'Panchos & FastFood', categoria: 'panchero', emoji: '🌭', abierto: true },
            { id: '3', nombre: 'Heladería Glaciar', categoria: 'heladeria', emoji: '🍦', abierto: true },
            { id: '4', nombre: 'Licorería San Juan', categoria: 'bebidas', emoji: '🥤', abierto: false },
            { id: '5', nombre: 'MiniSuper Central', categoria: 'almacen', emoji: '🛒', abierto: true },
            { id: '6', nombre: 'El Rey del Pancho', categoria: 'panchero', emoji: '🍟', abierto: true }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            actualizarEstadoCarrito();
            cargarUbicacionGuardada();
            renderizarTiendas();
            renderizarNotificaciones();
        });

        /* --- NOTIFICACIONES --- */
        function renderizarNotificaciones() {
            const list = document.getElementById('notifList');
            const badge = document.getElementById('notifyBadge');
            
            const noLeidas = notificaciones.filter(n => !n.leida).length;
            if (noLeidas > 0) {
                badge.textContent = noLeidas;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }

            if (notificaciones.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:var(--text-sub); font-size:0.8rem; padding:10px;">No tienes notificaciones.</div>`;
                return;
            }

            list.innerHTML = notificaciones.map(n => `
                <div class="notif-item ${!n.leida ? 'unread' : ''}">
                    <span class="notif-title">${n.titulo}</span>
                    <span class="notif-desc">${n.desc}</span>
                    <span class="notif-time">${n.hora}</span>
                </div>
            `).join('');
        }

        function toggleNotificaciones() {
            const dropdown = document.getElementById('notifDropdown');
            dropdown.classList.toggle('active');

            if (dropdown.classList.contains('active')) {
                notificaciones.forEach(n => n.leida = true);
                renderizarNotificaciones();
            }
        }

        function agregarNotificacion(titulo, desc) {
            const nueva = { id: Date.now(), titulo, desc, hora: "Ahora", leida: false };
            notificaciones.unshift(nueva);
            renderizarNotificaciones();
            mostrarToast(titulo, desc);
        }

        function limpiarNotificaciones() {
            notificaciones = [];
            renderizarNotificaciones();
        }

        function mostrarToast(titulo, desc) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-card';
            toast.innerHTML = `
                <div class="toast-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                </div>
                <div class="toast-content">
                    <span class="toast-title">${titulo}</span>
                    <span class="toast-body">${desc}</span>
                </div>
            `;
            container.appendChild(toast);

            setTimeout(() => { toast.remove(); }, 4000);
        }

        /* --- FILTRADO DE TIENDAS --- */
        function filtrarPorCategoria(cat, elemento) {
            categoriaSeleccionada = cat;
            document.querySelectorAll('.category-pill').forEach(btn => btn.classList.remove('active'));
            if(elemento) elemento.classList.add('active');
            renderizarTiendas();
        }

        function filtrarContenido() {
            renderizarTiendas();
        }

        function renderizarTiendas() {
            const textoBusqueda = document.getElementById('searchInput').value.toLowerCase().trim();
            const grid = document.getElementById('storesGrid');

            const filtradas = tiendasBD.filter(tienda => {
                const coincideCat = (categoriaSeleccionada === 'todas') || (tienda.categoria === categoriaSeleccionada);
                const coincideTexto = tienda.nombre.toLowerCase().includes(textoBusqueda) || tienda.categoria.toLowerCase().includes(textoBusqueda);
                return coincideCat && coincideTexto;
            });

            if (filtradas.length === 0) {
                grid.innerHTML = `<div class="empty-results">No se encontraron comercios que coincidan con la búsqueda.</div>`;
                return;
            }

            grid.innerHTML = filtradas.map(s => `
                <div class="store-card">
                    <div class="store-img-wrapper">${s.emoji}</div>
                    <div class="store-info">
                        <span class="store-cat-tag">${s.categoria}</span>
                        <h3 class="store-name">${s.nombre}</h3>
                        <button class="status-pill-btn ${s.abierto ? 'open' : 'closed'}">
                            ${s.abierto ? 'Abierto' : 'Cerrado'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function actualizarEstadoCarrito() {
            const carrito = JSON.parse(localStorage.getItem('mandado_express_carrito') || '[]');
            const badge = document.getElementById('cartBadge');
            const total = carrito.reduce((sum, item) => sum + (item.cantidad || 1), 0);
            if (total > 0) {
                badge.textContent = total;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        /* --- UBICACIÓN --- */
        function solicitarPermisoUbicacion() {
            if (!navigator.geolocation) {
                alert('La geolocalización no es compatible con este navegador.');
                return;
            }

            document.getElementById('currentAddress').textContent = "Obteniendo ubicación del dispositivo...";

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    usuarioUbicacion.lat = lat;
                    usuarioUbicacion.lng = lng;

                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                        const data = await res.json();
                        if (data && data.address) {
                            const calle = data.address.road || data.address.pedestrian || 'Calle Desconocida';
                            const num = data.address.house_number || '';
                            const depto = data.address.county || data.address.suburb || 'Santa Lucía';
                            
                            usuarioUbicacion.direccion = `${calle} ${num}`.trim() + ` (${depto})`;
                            usuarioUbicacion.departamento = depto;
                        } else {
                            usuarioUbicacion.direccion = `Ubicación GPS (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                        }
                    } catch {
                        usuarioUbicacion.direccion = `Ubicación GPS (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                    }

                    localStorage.setItem('mandado_express_ubicacion', JSON.stringify(usuarioUbicacion));
                    document.getElementById('currentAddress').textContent = usuarioUbicacion.direccion;
                    agregarNotificacion("Ubicación Actualizada 📍", usuarioUbicacion.direccion);
                },
                (err) => {
                    alert('Por favor autoriza la ubicación en tu navegador.');
                    document.getElementById('currentAddress').textContent = "Permiso denegado. Haz clic en 'Permitir Ubicación'.";
                },
                { enableHighAccuracy: true }
            );
        }

        function cargarUbicacionGuardada() {
            const saved = localStorage.getItem('mandado_express_ubicacion');
            if (saved) {
                usuarioUbicacion = JSON.parse(saved);
                document.getElementById('currentAddress').textContent = usuarioUbicacion.direccion;
            }
        }

        /* --- MODAL MAPA --- */
        function abrirModalUbicacion() {
            document.getElementById('locationModal').classList.add('active');
            setTimeout(() => {
                if (!mapInstance) {
                    mapInstance = L.map('leafletMap').setView([usuarioUbicacion.lat, usuarioUbicacion.lng], 16);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
                    markerInstance = L.marker([usuarioUbicacion.lat, usuarioUbicacion.lng], { draggable: true }).addTo(mapInstance);
                } else {
                    mapInstance.setView([usuarioUbicacion.lat, usuarioUbicacion.lng], 16);
                    markerInstance.setLatLng([usuarioUbicacion.lat, usuarioUbicacion.lng]);
                }
                mapInstance.invalidateSize();
            }, 300);
        }

        function cerrarModalUbicacion() {
            document.getElementById('locationModal').classList.remove('active');
        }

        function guardarUbicacionManual() {
            if (markerInstance) {
                const pos = markerInstance.getLatLng();
                usuarioUbicacion.lat = pos.lat;
                usuarioUbicacion.lng = pos.lng;
                usuarioUbicacion.direccion = `Ubicación Seleccionada (${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)})`;
                localStorage.setItem('mandado_express_ubicacion', JSON.stringify(usuarioUbicacion));
                document.getElementById('currentAddress').textContent = usuarioUbicacion.direccion;
                agregarNotificacion("Ubicación Guardada 📍", "Ubicación fijada en el mapa.");
            }
            cerrarModalUbicacion();
        }

        function toggleBuscador() {
            const el = document.getElementById('searchContainer');
            el.classList.toggle('active');
            if (el.classList.contains('active')) document.getElementById('searchInput').focus();
        }
    </script>
</body>
</html>
